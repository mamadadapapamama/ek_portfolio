<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EK Archive Admin</title>
  <style>
    :root {
      --ink: #15131a;
      --paper: #f5f1ea;
      --sky: #cfeaf3;
      --lavender: #c9a4f5;
      --lime: #dbf08b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 18px 44px;
      font-family: "Work Sans", system-ui, sans-serif;
      background: var(--sky);
      color: var(--ink);
    }

    .wrap {
      max-width: 920px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 6vw, 56px);
      line-height: 1;
    }

    .sub {
      margin: 0 0 22px;
      font-size: 14px;
      opacity: 0.8;
    }

    .grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .card {
      border: 2px solid var(--ink);
      box-shadow: 7px 7px 0 var(--ink);
      background: var(--paper);
      padding: 18px;
    }

    .card.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    input, textarea, button {
      font: inherit;
    }

    input[type="text"],
    input[type="date"],
    input[type="file"],
    textarea {
      width: 100%;
      border: 1.5px solid var(--ink);
      background: #fff;
      padding: 10px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.45;
    }

    .actions {
      margin-top: 12px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button {
      border: 2px solid var(--ink);
      background: var(--lime);
      font-weight: 600;
      padding: 10px 14px;
      cursor: pointer;
    }

    button:hover {
      transform: translate(-1px, -1px);
    }

    #status {
      font-size: 13px;
      opacity: 0.85;
    }

    .preview img {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border: 1.5px solid var(--ink);
      margin-bottom: 10px;
    }

    .preview h2 {
      margin: 0 0 6px;
      line-height: 1.2;
      font-size: 28px;
    }

    .muted {
      margin: 0 0 10px;
      font-size: 13px;
      opacity: 0.75;
    }

    #list {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    #list li {
      background: #fff;
      border: 1.5px solid var(--ink);
      padding: 10px;
      display: grid;
      gap: 6px;
    }

    #list b {
      font-size: 16px;
    }

    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>app.ekkim.work</h1>
    <p class="sub">이미지, 제목, 날짜, 본문을 저장하면 메인 사이트 Hero에 최신 글이 반영됩니다.</p>

    <div class="grid">
      <section class="card full">
        <form id="entryForm">
          <div class="grid">
            <div>
              <label for="title">Title</label>
              <input id="title" name="title" type="text" required placeholder="아카이브 제목">
            </div>
            <div>
              <label for="date">Date</label>
              <input id="date" name="date" type="date" required>
            </div>
          </div>

          <div style="margin-top: 12px;">
            <label for="image">Image</label>
            <input id="image" name="image" type="file" accept="image/*" required>
          </div>

          <div style="margin-top: 12px;">
            <label for="body">Body</label>
            <textarea id="body" name="body" required placeholder="본문을 입력하세요"></textarea>
          </div>

          <div class="actions">
            <button type="submit">Save Entry</button>
            <span id="status"></span>
          </div>
        </form>
      </section>

      <section class="card preview">
        <label>Latest Hero Entry</label>
        <img id="latestImage" alt="" hidden>
        <h2 id="latestTitle">아직 저장된 항목이 없습니다.</h2>
        <p class="muted" id="latestDate"></p>
        <p id="latestBody"></p>
      </section>

      <section class="card">
        <label>Recent Entries</label>
        <ul id="list"></ul>
      </section>
    </div>
  </main>

  <script>
    const form = document.getElementById("entryForm");
    const statusEl = document.getElementById("status");
    const latestImage = document.getElementById("latestImage");
    const latestTitle = document.getElementById("latestTitle");
    const latestDate = document.getElementById("latestDate");
    const latestBody = document.getElementById("latestBody");
    const listEl = document.getElementById("list");

    function renderLatest(entry) {
      if (!entry) {
        latestImage.hidden = true;
        latestTitle.textContent = "아직 저장된 항목이 없습니다.";
        latestDate.textContent = "";
        latestBody.textContent = "";
        return;
      }

      latestImage.src = entry.imageUrl;
      latestImage.alt = entry.title;
      latestImage.hidden = false;
      latestTitle.textContent = entry.title;
      latestDate.textContent = entry.date;
      latestBody.textContent = entry.body;
    }

    function renderList(items) {
      if (!items.length) {
        listEl.innerHTML = "<li>저장된 아카이브가 없습니다.</li>";
        return;
      }

      listEl.innerHTML = items
        .map((item) => `<li><b>${item.title}</b><span>${item.date}</span></li>`)
        .join("");
    }

    async function loadEntries() {
      const res = await fetch("/api/entries");
      if (!res.ok) {
        throw new Error("Failed to load entries");
      }
      const data = await res.json();
      const items = data.items || [];
      renderLatest(items[0]);
      renderList(items);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      statusEl.textContent = "saving...";

      const formData = new FormData(form);

      try {
        const res = await fetch("/api/entries", {
          method: "POST",
          body: formData,
        });
        const payload = await res.json();

        if (!res.ok) {
          throw new Error(payload.message || "Save failed");
        }

        statusEl.textContent = "saved. hero updated on main site.";
        form.reset();
        await loadEntries();
      } catch (error) {
        statusEl.textContent = error.message;
      }
    });

    loadEntries().catch(() => {
      statusEl.textContent = "cannot load entries";
      renderLatest(null);
      renderList([]);
    });
  </script>
</body>
</html>
