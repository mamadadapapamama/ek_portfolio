services:
  - type: web
    name: ekkim-archive
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATA_DIR
        value: /opt/render/project/src/persistent/data
      - key: UPLOAD_DIR
        value: /opt/render/project/src/persistent/uploads
    disk:
      name: archive-data
      mountPath: /opt/render/project/src/persistent
      sizeGB: 1
